# Deploy the AOSP Mastery site to GitHub Pages.
#
# Action versions verified against the official GitHub Pages starter workflow
# and the Node.js starter workflow (actions/starter-workflows):
#   checkout@v4, setup-node@v4, configure-pages@v5,
#   upload-pages-artifact@v3, deploy-pages@v5
#
# NOTE: this site lives in the `aosp-mastery-site/` subfolder of the repo,
# so `working-directory` and the uploaded artifact `path` point there.

name: Deploy site to GitHub Pages

on:
  # Runs on pushes to the default branch
  push:
    branches: [main]
    paths:
      - 'aosp-mastery-site/**'
      - '.github/workflows/deploy.yml'
  # Allows manual runs from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aosp-mastery-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aosp-mastery-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: aosp-mastery-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
